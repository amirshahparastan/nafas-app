name: Nafas Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build preview APK
        run: flutter build apk --release

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: nafas-v1-preview-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
